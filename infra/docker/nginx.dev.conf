# InfraRed 로컬 데모용 리버스 프록시
# 목적: 대시보드와 API를 같은 오리진(http://localhost:3000)으로 묶어
#       HttpOnly 쿠키 인증이 로컬에서도 동작하게 한다.
#   /  → frontend(정적, :80)
#   /api, /auth, /ingest, /heartbeat, /events, /healthz, /metrics → ingestion(:8000)

server {
    listen 80;
    server_name _;

    # 웹 액세스 로그(combined) → 에이전트 nginx_tailer가 읽어 WEB 스캔/카나리 탐지
    access_log /var/log/nginx/access.log combined;

    # ── API / 인증 / 수집 → ingestion ─────────────────────────────
    location ~ ^/(api|auth|ingest|heartbeat|events|healthz|metrics|docs|openapi.json) {
        proxy_pass http://ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE(events/stream) 지원
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ── 그 외 전부 → frontend 정적 ────────────────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
