# === InfraRed edge proxy (deployed copy) ===
# 배포 위치: EC2 /opt/infrared/nginx.conf  (infrared-proxy 컨테이너의 /etc/nginx/conf.d/default.conf)
#
# 로그인이 쿠키 기반(credentials: include)이라 프론트는 API를 "같은 출처(상대경로)"로 호출함.
# 따라서 같은 호스트에서 분리:
#   - 정적 자산 + SPA 페이지 라우트(/faq, /login, /dashboard ...) -> frontend (SPA, 자체 try_files 폴백)
#   - 그 외 전부(= API: /auth, /incidents, /onboarding/*, /status/public ...) -> backend(ingestion)
#   - api.infrared.kr -> backend (에이전트/외부용)
# 변경 시: EC2 /opt/infrared/nginx.conf 반영 후
#   docker exec infrared-proxy nginx -t && docker exec infrared-proxy nginx -s reload

# API 전용 호스트 -> backend
server {
    listen 443 ssl;
    server_name api.infrared.kr;
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    location / {
        proxy_pass http://ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# app / apex / 직접 :8000 -> 같은 출처에서 SPA + API 분리
server {
    listen 443 ssl default_server;
    listen 8000 default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # ---- 정적 자산 -> frontend ----
    location = / { proxy_pass http://frontend:80; }
    location = /index.html { proxy_pass http://frontend:80; }
    location /assets/ { proxy_pass http://frontend:80; }
    location ~* \.(js|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|webmanifest|txt)$ {
        proxy_pass http://frontend:80;
    }

    # ---- SPA 페이지 라우트 -> frontend ----
    location ~ ^/(login|register|dashboard|verify-email|forgot-password|reset-password|docs|changelog|privacy|terms|security|faq|features)(/|$) {
        proxy_pass http://frontend:80;
    }

    # /status: 페이지는 frontend, 단 /status/public(API)만 backend
    location = /status/public {
        proxy_pass http://ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location ~ ^/status(/|$) { proxy_pass http://frontend:80; }

    # /onboarding: 페이지(정확히)만 frontend, 하위(/onboarding/*)는 API
    location = /onboarding { proxy_pass http://frontend:80; }

    # ---- 그 외 전부(API) -> backend (쿠키 인증 동일 출처 유지) ----
    location / {
        proxy_pass http://ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
