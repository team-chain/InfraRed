# === InfraRed edge proxy (deployed copy) ===
# 배포 위치: EC2 /opt/infrared/nginx.conf  (infrared-proxy 컨테이너의 /etc/nginx/conf.d/default.conf 로 바인드 마운트)
# 라우팅:
#   - api.infrared.kr            -> backend (ingestion:8000)
#   - 그 외 모든 호스트(app, apex) -> frontend (SPA, frontend 컨테이너 자체 try_files /index.html 폴백)
#   - :8000 직접 접근            -> backend (기존 동작 유지)
# 주의: 이 파일은 CI 가 자동 동기화하지 않음. 변경 시 EC2 /opt/infrared/nginx.conf 에 직접 반영 후
#       `docker exec infrared-proxy nginx -t && docker exec infrared-proxy nginx -s reload`

# 내부/직접 :8000 접근은 기존대로 백엔드 유지
server {
    listen 8000;
    server_name _;
    location / {
        proxy_pass http://ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
# API (HTTPS) -> backend
server {
    listen 443 ssl;
    server_name api.infrared.kr;
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    location / {
        proxy_pass http://ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
# 그 외 전부(app.infrared.kr, infrared.kr ...) -> frontend SPA
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
